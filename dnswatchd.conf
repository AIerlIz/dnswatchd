# dnswatchd publishes one feed per architecture.
# Pick the file for your router:
#
#   https://AIerlIz.github.io/dnswatchd/dnswatchd-aarch64_cortex-a53.conf
#   https://AIerlIz.github.io/dnswatchd/dnswatchd-aarch64_generic.conf
#   https://AIerlIz.github.io/dnswatchd/dnswatchd-arm_cortex-a7_neon-vfpv4.conf
#   https://AIerlIz.github.io/dnswatchd/dnswatchd-mips_24kc.conf
#   https://AIerlIz.github.io/dnswatchd/dnswatchd-mipsel_24kc.conf
#   https://AIerlIz.github.io/dnswatchd/dnswatchd-x86_64.conf
#
#   opkg print-architecture
#   wget -O /etc/opkg/dnswatchd.conf https://AIerlIz.github.io/dnswatchd/dnswatchd-<arch>.conf
src/gz dnswatchd https://AIerlIz.github.io/dnswatchd/<arch>
