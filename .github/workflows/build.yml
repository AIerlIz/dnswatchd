name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Packages are built against one release and must install on all three
  # supported lines. That works because the probe is statically linked and the
  # rest is shell: nothing binds to this SDK's libc.
  SDK_VERSION: '24.10.8'


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -e
          for f in dnswatchd/files/dnswatchd \
                   dnswatchd/files/lib/*.sh \
                   dnswatchd/files/dnswatchd.init \
                   dnswatchd/files/dnswatchd.uci-defaults \
                   dnswatchd/files/rpcd/dnswatchd \
                   scripts/*.sh \
                   tests/probe/run.sh tests/probe/fixture_dns.py \
                   tests/core/run.sh tests/core/takeover.sh \
                   tests/core/shim/functions.sh; do
            case "$f" in
              *.py) python3 -m py_compile "$f" ;;
              *)    sh -n "$f" ;;
            esac
            echo "ok $f"
          done

      - name: JSON and JS
        run: |
          set -e
          python3 -m json.tool luci-app-dnswatchd/root/usr/share/luci/menu.d/luci-app-dnswatchd.json >/dev/null
          python3 -m json.tool luci-app-dnswatchd/root/usr/share/rpcd/acl.d/luci-app-dnswatchd.json >/dev/null
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/build.yml'))"
          node --check luci-app-dnswatchd/htdocs/luci-static/resources/view/dnswatchd/main.js
          echo "json/yaml/js OK"

      - name: Translation coverage
        run: node scripts/check-translations.js

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './dnswatchd/files'
          severity: warning
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build probe (host)
        run: gcc -O2 -Wall -Wextra -o /tmp/dnswatch-probe dnswatchd/files/dnswatch-probe.c

      - name: Probe behaviour
        run: sh tests/probe/run.sh /tmp/dnswatch-probe

      - name: Core rounds
        run: sh tests/core/run.sh

      - name: Takeover and rollback
        run: sh tests/core/takeover.sh

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    strategy:
      fail-fast: false
      matrix:
        target:
          - 'x86/64'
          - 'armsr/armv8'
          - 'mediatek/filogic'
          - 'ramips/mt7621'
          - 'ath79/generic'
          - 'ipq40xx/generic'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SDK filename
        id: sdk
        run: |
          set -e
          BASE="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/${{ matrix.target }}/"
          # The gcc version is part of the filename and changes between releases;
          # hard-coding it is how the 0.1.x CI would have silently died.
          FILE=$(curl -fsSL "$BASE" | grep -oE 'openwrt-sdk-[^"<]*Linux-x86_64\.tar\.zst' | head -1)
          test -n "$FILE" || { echo "no SDK found under $BASE" >&2; exit 1; }
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "using $FILE"

      - name: Cache SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: sdk-${{ env.SDK_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}-${{ steps.sdk.outputs.file }}

      - name: Download SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # curl 92 (HTTP/2 stream error) shows up often enough against the CDN
          # to fail a build for no reason. Retry, and stay on HTTP/1.1.
          curl -fL --http1.1 --retry 5 --retry-delay 5 --retry-all-errors \
            -o sdk.tar.zst \
            "https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/${{ matrix.target }}/${{ steps.sdk.outputs.file }}"
          ls -lh sdk.tar.zst

      - name: Extract SDK
        run: |
          set -e
          rm -rf sdk && mkdir -p sdk
          zstd -d -c sdk.tar.zst | tar -x -C sdk --strip-components=1
          test -f sdk/rules.mk

      - name: Add local feed
        run: |
          set -e
          cd sdk
          sed -i '\|^src-link dnswatchd |d' feeds.conf.default
          echo "src-link dnswatchd $GITHUB_WORKSPACE" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: sdk
        run: make defconfig

      - name: Compile
        working-directory: sdk
        run: |
          set -e
          # luci.mk turns po/ into a separate luci-i18n-* package with po2lmo,
          # which is a host tool built by luci-base. Without this the translation
          # package silently does not exist.
          make package/luci-base/host/compile V=s -j"$(nproc)"
          make package/dnswatchd/compile V=s -j"$(nproc)"
          # This one target also builds the generated luci-i18n-dnswatchd-zh-cn
          # package: luci.mk defines it inside the same Makefile, and a
          # sub-package has no directory of its own to name on the command line.
          make package/luci-app-dnswatchd/compile V=s -j"$(nproc)"

      - name: Collect
        id: collect
        run: |
          set -e
          mkdir -p out
          for ipk in $(find sdk/bin \( -name 'dnswatchd_*.ipk' -o -name 'luci-app-dnswatchd_*.ipk' \
                        -o -name 'luci-i18n-dnswatchd-*.ipk' \)); do
            arch=$(sh scripts/ipk-field.sh "$ipk" Architecture)
            test -n "$arch" || { echo "no Architecture in $ipk" >&2; exit 1; }
            mkdir -p "out/$arch"
            cp -v "$ipk" "out/$arch/"
          done
          test -n "$(find out -name '*.ipk')" || { echo "no package produced" >&2; exit 1; }
          test -n "$(find out -name 'luci-i18n-dnswatchd-*.ipk')" || {
            echo "the zh_Hans translation package was not produced" >&2; exit 1; }

          fail=0
          set +e
          for ipk in $(find out -name '*.ipk' | sort); do
            pkg=$(sh scripts/ipk-field.sh "$ipk" Package)
            sh scripts/smoke-ipk.sh "$ipk" "$pkg" || fail=1
          done
          set -e
          test "$fail" -eq 0

      - uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ strategy.job-index }}
          path: out/*/*.ipk
          if-no-files-found: error

  qemu:
    name: QEMU smoke ${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: [ build ]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 25.12 is absent on purpose: it ships apk, this feed is ipk.
        version: [ '23.05.6', '24.10.8' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: ipk
          merge-multiple: true

      - name: Assemble the x86_64 package set
        run: |
          set -e
          mkdir -p pkgs
          find ipk -name 'dnswatchd_*_x86_64.ipk' -exec cp {} pkgs/ \;
          find ipk -name 'luci-app-dnswatchd_*_all.ipk' -exec cp {} pkgs/ \;
          # Several builds contribute the same arch=all package; keep the newest.
          ls ipk/all/luci-i18n-dnswatchd-*.ipk 2>/dev/null | sort | tail -1 | xargs -r cp -t pkgs/
          ls -l pkgs
          test "$(ls pkgs/*.ipk | wc -l)" -eq 3

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86

      - name: Boot, install, take over, roll back
        run: |
          python3 scripts/qemu-smoke.py \
            --ipk-dir pkgs \
            --version ${{ matrix.version }} \
            --boot-timeout 1800


  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ build, test, lint, qemu ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches PKG_VERSION
        run: |
          set -e
          VERSION=$(sed -n 's/^PKG_VERSION:=//p' dnswatchd/Makefile)
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match PKG_VERSION ${VERSION}" >&2
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: ipk
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # download-artifact preserves each artifact's own directory layout, so
          # the packages are at ipk/<arch>/<file>.ipk. A flat ipk/*.ipk glob
          # matches nothing and the release is published empty without an error.
          files: ipk/**/*.ipk
          fail_on_unmatched_files: true
          generate_release_notes: true

  feed:
    name: Publish opkg feed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: ipk
          merge-multiple: true

      - name: Rebuild the feed tree
        run: |
          set -e

          # Old versions stay published: opkg picks the newest one, and the rest
          # remain downloadable for anyone pinning a version. gh-pages is the
          # accumulator, so start from whatever is already deployed.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pages
            rm -rf pages/.git
          else
            mkdir -p pages
          fi

          # Architecture-specific packages go to their own directory.
          for f in $(find ipk -name '*.ipk' | sort); do
            arch=$(sh scripts/ipk-field.sh "$f" Architecture)
            if [ "$arch" = "all" ]; then continue; fi
            mkdir -p "pages/$arch"
            cp "$f" "pages/$arch/"
          done

          # Architecture-independent ones are duplicated into every directory,
          # including the ones that already existed. Otherwise
          # `opkg install luci-app-dnswatchd` fails on every target that was
          # published before this run.
          DIRS=$(find pages -mindepth 1 -maxdepth 1 -type d | sort)
          for dir in $DIRS; do
            for f in $(find ipk -name '*.ipk' | sort); do
              arch=$(sh scripts/ipk-field.sh "$f" Architecture)
              if [ "$arch" = "all" ]; then cp "$f" "$dir/"; fi
            done
          done

          for dir in $DIRS; do
            sh scripts/mkindex.sh "$dir"
          done

          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          BASE="https://${OWNER}.github.io/${REPO}"

          # One conf per architecture, so `wget .../dnswatchd-<arch>.conf` is a
          # working command rather than a template somebody has to edit.
          for dir in $DIRS; do
            arch=$(basename "$dir")
            printf 'src/gz dnswatchd %s/%s\n' "$BASE" "$arch" \
              > "pages/dnswatchd-${arch}.conf"
          done

          # The bare name stays as a pointer for anyone who guesses the old URL.
          {
            echo "# dnswatchd publishes one feed per architecture."
            echo "# Pick the file for your router:"
            echo "#"
            for dir in $DIRS; do
              arch=$(basename "$dir")
              echo "#   ${BASE}/dnswatchd-${arch}.conf"
            done
            echo "#"
            echo "#   opkg print-architecture"
            echo "#   wget -O /etc/opkg/dnswatchd.conf ${BASE}/dnswatchd-<arch>.conf"
            echo "src/gz dnswatchd ${BASE}/<arch>"
          } > pages/dnswatchd.conf

          find pages -name '*.ipk' | sort

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          keep_files: false
