name: Build OpenWrt packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 两个包都是 PKGARCH:=all（纯脚本，无架构依赖），用任意 target 的 SDK 都能编，
  # 编出来的 ipk 在 aarch64 / x86 / mips 上通用。
  SDK_VERSION: 24.10-SNAPSHOT
  SDK_TARGET: x86/64
  SDK_ARCH: x86-64

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          set -e
          for f in dnswatchd/files/dnswatchd \
                   dnswatchd/files/dnswatchd.init \
                   dnswatchd/files/dnswatchd.uci-defaults; do
            echo "== $f"
            sh -n "$f"
          done
          echo "all scripts OK"

      - name: JSON / YAML sanity
        run: |
          set -e
          python3 -m json.tool luci-app-dnswatchd/root/usr/share/luci/menu.d/luci-app-dnswatchd.json > /dev/null
          python3 -m json.tool luci-app-dnswatchd/root/usr/share/rpcd/acl.d/luci-app-dnswatchd.json > /dev/null
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/build.yml'))"
          echo "json/yaml OK"

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './dnswatchd/files'
          severity: warning
        continue-on-error: true

  build:
    name: Build ipk
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Cache SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: sdk-${{ env.SDK_VERSION }}-${{ env.SDK_ARCH }}-v1

      - name: Download SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          URL="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/${SDK_TARGET}/openwrt-sdk-${SDK_VERSION}-${SDK_ARCH}_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          echo "downloading $URL"
          curl -fsSL -o sdk.tar.zst "$URL"
          ls -lh sdk.tar.zst
          mkdir -p sdk
          # 不用 tar --use-compress-program：ubuntu-latest 的 tar 对 .zst 支持不稳，
          # 显式走 zstd -d | tar -x 更可靠
          zstd -d -c sdk.tar.zst | tar -x -C sdk --strip-components=1
          rm -f sdk.tar.zst
          ls sdk | head

      - name: Verify SDK
        run: |
          test -f sdk/rules.mk && echo "SDK looks valid"
          test -d sdk/scripts && echo "scripts/ present"
          test -f sdk/feeds.conf.default && echo "feeds.conf.default present"

      - name: Add our feed
        run: |
          set -e
          echo "src-link dnswatchd $GITHUB_WORKSPACE" >> sdk/feeds.conf.default
          cat sdk/feeds.conf.default

      - name: Update and install feeds
        working-directory: sdk
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: sdk
        run: |
          set -e
          make defconfig
          grep -E 'CONFIG_PACKAGE_(dnswatchd|luci-app-dnswatchd)' .config || true

      - name: Build packages
        working-directory: sdk
        run: |
          set -e
          make package/dnswatchd/compile V=s -j"$(nproc)"
          make package/luci-app-dnswatchd/compile V=s -j"$(nproc)"

      - name: Show results
        working-directory: sdk
        run: |
          echo "=== bin/packages tree ==="
          find bin/packages -type f -name '*.ipk' -o -type d -name 'dnswatchd*' 2>/dev/null | head -30
          echo "=== all ipk ==="
          find bin -name '*.ipk' 2>/dev/null | head -30
          ls -laR bin/packages 2>/dev/null | head -60

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          find sdk/bin -name '*.ipk' -exec cp -v {} out/ \;
          echo "=== out/ ==="
          ls -la out/
          # 至少要有两个包，否则这次构建视为失败
          count=$(ls out/*.ipk 2>/dev/null | wc -l)
          echo "collected $count ipk"
          test "$count" -ge 2

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: out/*.ipk
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.ipk
          generate_release_notes: true

  feed:
    name: Publish opkg feed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ipk
          path: ipk

      - name: Build feed index
        run: |
          set -e
          mkdir -p public/aarch64_cortex-a53
          cp ipk/*.ipk public/aarch64_cortex-a53/
          cd public/aarch64_cortex-a53
          : > Packages
          for f in *.ipk; do
            rm -rf /tmp/ipkx && mkdir -p /tmp/ipkx && cd /tmp/ipkx
            ar -x "$OLDPWD/$f" 2>/dev/null || true
            tar -xzf control.tar.gz 2>/dev/null || tar -xzf control.tar.gz ./control 2>/dev/null || true
            if [ -f ./control ]; then
              cat ./control
              printf 'Filename: aarch64_cortex-a53/%s\n' "$f"
              printf 'Size: %s\n' "$(stat -c%s "$OLDPWD/$f")"
              printf 'SHA256sum: %s\n\n' "$(sha256sum "$OLDPWD/$f" | awk '{print $1}')"
            fi
            cd "$OLDPWD"
          done >> Packages
          gzip -kf Packages
          ls -la

      - name: Write opkg feed config
        run: |
          cat > public/dnswatchd.conf <<EOF
          src/gz dnswatchd https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/aarch64_cortex-a53
          EOF
          cat public/dnswatchd.conf

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
